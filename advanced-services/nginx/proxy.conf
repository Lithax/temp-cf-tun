# Shared proxy settings for every generated service location.
# By the time a request reaches here it has already passed:
#   the Worker's URL-secret gate (401 at the edge)
#   -> nginx's X-Tunnel-Secret check (444 for direct tunnel hits)
#   -> this service's X-Service-Secret map check (401 if it has a secret).

proxy_http_version 1.1;

# WebSockets / SSE (MCP servers use both)
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# The backend sees the real visitor IP the Worker forwarded, not the tunnel's.
proxy_set_header X-Real-IP $client_ip;
proxy_set_header X-Forwarded-For $client_ip;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Host $http_host;

# The gateway secrets stop here: never hand them to the backend.
proxy_set_header X-Tunnel-Secret "";
proxy_set_header X-Service-Secret "";

# MCP / SSE means long-lived streams.
proxy_buffering off;
proxy_cache off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
