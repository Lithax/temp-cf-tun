services:
  # if you only want the cftunnel and nothing else, only use this
  cloudflared:
    image: cfquicktunnel:latest
    container_name: cftunnel
    restart: unless-stopped
    environment:
      SERVICE_URL: ${SERVICE_URL}
      ACCOUNT_ID: ${ACCOUNT_ID}
      NAMESPACE_ID: ${NAMESPACE_ID}
      API_TOKEN: ${API_TOKEN}
      HTTP_HOST_HEADER: ${HTTP_HOST_HEADER}
    volumes:
      - "/etc/ssl/certs/reverse-proxy.pem:/etc/ssl/certs/server.crt:ro"
    networks:
      - cftunnel
    build:
      context: ./cftunnel

  # for the services
  proxy:
    image: proxy-cftunnel:latest
    container_name: proxy-cftunnel
    restart: unless-stopped
    build:
      context: ./nginx
    # Passes the whole .env through, so a new service only needs a line in
    # .env and a section in services.ini, with no compose edits.
    env_file: .env
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      PROXY_TUNNEL_SECRET: ${PROXY_ENTRY_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./services.ini:/etc/nginx/services.ini:ro
      - ./server.crt:/etc/nginx/certs/server.crt:ro
      - ./server.key:/etc/nginx/certs/server.key:ro
    networks:
      - cftunnel

networks:
  cftunnel:
    external: true
